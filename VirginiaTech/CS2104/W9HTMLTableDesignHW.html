<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        table, th, td 
            {
                border : 1px solid black;
                border-collapse: collapse;
                
            }
        
        th
            {
                position: sticky;
                top : 0;
                background-color: black;
                color: white;
                border: 3px solid black;
                
            }
        td
            {
                text-align: center;
            }

        table
            {
                margin:auto;
            }
        
            td:nth-child(3n) {font-weight: bold;}
        tr:nth-child(3n) {background-color: rgba(133, 62, 180, 0.5);}
        tr:nth-child(3n-1) {background-color: rgba(120, 119, 121, 0.5);}
        
        tbody tr:hover {background-color: rgb(62, 142, 180);}  /*Copilot told me how to preface tr:hover with tbody to exclude the header*/                
       
    </style>
</head>
